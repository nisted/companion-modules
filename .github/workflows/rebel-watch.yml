name: Rebel Watch

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: rebel-watch

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check the token is there
        env:
          GH_TOKEN: ${{ secrets.REBEL_WATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::No REBEL_WATCH_TOKEN secret yet. Add one (see README: Rebel Watch) and run this again."
            exit 1
          fi
      - name: Look for upstream releases
        id: watch
        env:
          GH_TOKEN: ${{ secrets.REBEL_WATCH_TOKEN }}
        run: tools/rebel-watch.sh
      - name: Remember what was seen
        if: steps.watch.outputs.changed == '1'
        run: |
          git config user.name "Rebel Watch"
          git config user.email "rebel-watch@users.noreply.github.com"
          git add rebel-state.json
          git commit -m "Rebel Watch: upstream versions seen"
          git push
